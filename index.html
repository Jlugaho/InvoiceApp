<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta name="description" content="A clearer way to manage invoices, customers, and cash flow." />
    <title>InvoiceApp — Invoice management</title>
  </head>
  <body>
    <section id="authGate" class="auth-screen" hidden>
      <div class="auth-brand"><span class="brand-mark">I</span> InvoiceApp</div>
      <div class="auth-card">
        <div class="auth-icon"><i data-lucide="shield-check"></i></div>
        <span class="eyebrow">YOUR WORKSPACE</span>
        <h1>Welcome back.</h1>
        <p>Enter your private access key to continue to your financial workspace.</p>
        <form id="authForm">
          <label for="apiKey">Workspace access key</label>
          <input id="apiKey" type="password" autocomplete="current-password" placeholder="Enter your access key" required />
          <button type="submit" class="button button-primary auth-submit">Open workspace <span>→</span></button>
        </form>
        <p id="authError" class="auth-error" role="alert"></p>
        <div class="auth-footnote"><i data-lucide="lock-keyhole"></i> Your key is stored only in this browser tab.</div>
      </div>
      <p class="auth-legal">SECURE WORKSPACE · INVOICE MANAGEMENT</p>
    </section>
    <main class="protected-content" hidden>
      <div id="root"></div>
    </main>
    <script src="/auth.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
