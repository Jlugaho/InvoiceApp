<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InvoiceApp | SaaS-Level Invoice Generator</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />

  <!-- Favicon (optional) -->
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/4679/4679712.png" />
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-indigo-100 min-h-screen text-gray-800 flex flex-col">
  <nav class="bg-white shadow-md p-4 flex justify-between items-center sticky top-0">
    <h1 class="text-2xl font-bold text-indigo-600">InvoiceApp</h1>
    <button id="themeToggle" class="px-3 py-2 bg-indigo-600 text-white rounded-md hover:bg-indigo-700">Dark Mode</button>
  </nav>

  <main class="flex-1 p-6 grid md:grid-cols-2 gap-6">
    <!-- Left Column -->
    <section class="card-glass">
      <h2 class="text-lg font-semibold mb-4">Add Items</h2>
      <div id="itemsContainer"></div>
      <button id="addItemBtn" class="w-full mt-3 bg-indigo-500 text-white py-2 rounded-md hover:bg-indigo-600">+ Add Item</button>

      <div class="mt-6">
        <h3 class="font-semibold mb-2">Totals</h3>
        <div class="space-y-1 text-sm">
          <div class="flex justify-between"><span>Subtotal:</span> <span id="subtotal">$0.00</span></div>
          <div class="flex justify-between"><span>Tax (8.5%):</span> <span id="tax">$0.00</span></div>
          <div class="flex justify-between"><span>Discount:</span> <span id="discount">$0.00</span></div>
          <hr />
          <div class="flex justify-between font-semibold text-indigo-600"><span>Total:</span> <span id="total">$0.00</span></div>
        </div>
      </div>
    </section>

    <!-- Right Column -->
    <section id="invoicePreview" class="card-glass">
      <h2 class="text-lg font-semibold mb-4">Invoice Preview</h2>
      <div id="previewContent" class="space-y-2 text-sm"></div>
      <button id="exportPdfBtn" class="mt-6 w-full bg-green-500 text-white py-2 rounded-md hover:bg-green-600">Export as PDF</button>
    </section>
  </main>

  <footer class="text-center text-sm text-gray-500 py-4">
    © 2025 InvoiceApp. All rights reserved.
  </footer>

  <script src="lib/html2canvas.min.js"></script>
  <script src="lib/jspdf.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
